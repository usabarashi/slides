<text x="56" y="446" font-size="19" font-weight="700" fill="#2aa198">NixOS 側（ infrastructure ）で module のパラメーターを設定する</text>
<rect x="56" y="462" width="400" height="122" rx="10" fill="#ffffff" stroke="#2aa198" stroke-width="2" opacity="0.9" />
<text x="72" y="488" font-size="14" fill="#3f4d52" font-weight="400" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">services.app-a = {</text>
<text x="88.8" y="514" font-size="14" fill="#268bd2" font-weight="700" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">enable = true;</text>
<text x="88.8" y="536" font-size="14" fill="#268bd2" font-weight="700" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">port = 8080;</text>
<text x="72" y="558" font-size="14" fill="#3f4d52" font-weight="400" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">};</text>
<text x="484" y="488" font-size="15" fill="#586e75">module.nix が options を定義しているので, 有効化もパラメーターも NixOS 側で書ける</text>
<text x="484" y="518" font-size="15" fill="#586e75">Application側は実装, NixOS 側は設定という分担になる</text>
<text x="484" y="548" font-size="15" fill="#586e75">パラメーターを変えても, Applicationのコードは触らない</text>
<text x="484" y="578" font-size="15" fill="#586e75">既定値も module.nix 側に置ける（ 公開ポート・保存先・ログ量など ）</text>
<path d="M 265 384 V 404" fill="none" stroke="#586e75" stroke-width="2.5" marker-end="url(#arrow)" />
