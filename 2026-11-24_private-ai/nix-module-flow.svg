<text x="66.8" y="212" font-size="14" fill="#268bd2" font-weight="700" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">app-b.url = &quot;github:example/app-b&quot;;</text>
<text x="66.8" y="236" font-size="14" fill="#268bd2" font-weight="700" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">app-c.url = &quot;github:example/app-c&quot;;</text>
<text x="58.4" y="260" font-size="14" fill="#3f4d52" font-weight="400" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">};</text>
<text x="58.4" y="292" font-size="14" fill="#3f4d52" font-weight="400" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">outputs = { self, nixpkgs, ... }@inputs: {</text>
<text x="66.8" y="316" font-size="14" fill="#3f4d52" font-weight="400" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">nixosConfigurations.&lt;host&gt; = ...;</text>
<text x="58.4" y="340" font-size="14" fill="#3f4d52" font-weight="400" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">};</text>
<text x="50" y="364" font-size="14" fill="#3f4d52" font-weight="400" font-family="'SF Mono',Menlo,'DejaVu Sans Mono',monospace">}</text>
